name: Publish to npm (trusted publishing / OIDC)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install deps (prepare/build toolchain)
        # cordis 是运行时由 DSH 宿主提供的 peer，发布构建不需要安装
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Check version not already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG_NAME@$PKG_VERSION already published (e.g. manual bootstrap); skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $PKG_NAME@$PKG_VERSION"
          fi

      - name: Build and test
        run: |
          npm run build
          npm test

      # npm detects the GitHub OIDC environment and creates a short-lived publish credential.
      - name: Publish
        if: steps.check.outputs.exists != 'true'
        run: npm publish --access public

# Configure this exact publisher in npm package settings:
# GitHub Actions / <owner> / <repo> / release.yml / no environment.
# 首次发布前需在 npm 侧完成一次性 bootstrap（包不存在时 Trusted Publisher
# 无法先于首版配置），详见 README「维护者发布」。

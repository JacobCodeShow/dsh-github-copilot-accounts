name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # cordis 是运行时由 DSH 宿主提供的 peer，构建/测试不需要安装
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm test
